services:
  postgres:
    image: postgres:17-alpine
    container_name: cloudmart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudmart_user
      POSTGRES_PASSWORD: cloudmart_password
      POSTGRES_DB: cloudmart_db
    ports:
      - '5432:5432'
    volumes:
      - cloudmart_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cloudmart_user -d cloudmart_db']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cloudmart-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - cloudmart_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cloudmart_postgres_data:
  cloudmart_redis_data:
